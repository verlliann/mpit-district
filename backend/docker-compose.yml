# Full stack docker-compose - все сервисы AI-Newsmaker
# Запуск: docker-compose up -d

services:
  # ============== INFRASTRUCTURE ==============
  
  postgres:
    image: postgres:15-alpine
    container_name: newsmaker-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: newsmaker
      POSTGRES_PASSWORD: newsmaker_dev_password
      POSTGRES_DB: newsmaker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsmaker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newsmaker-network

  redis:
    image: redis:7-alpine
    container_name: newsmaker-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis_dev_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newsmaker-network

  minio:
    image: minio/minio:latest
    container_name: newsmaker-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - newsmaker-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: newsmaker-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: newsmaker
      RABBITMQ_DEFAULT_PASS: newsmaker_rabbit_pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - newsmaker-network

  # ============== BACKEND SERVICES ==============

  # Storage Service (Go) - gRPC на 50055
  storage-service:
    build:
      context: ./services/storage
      dockerfile: Dockerfile
    container_name: newsmaker-storage
    ports:
      - "50055:50055"
    environment:
      - GRPC_PORT=50055
      - DATABASE_URL=postgres://newsmaker:newsmaker_dev_password@postgres:5432/newsmaker?sslmode=disable
      - REDIS_URL=redis://:redis_dev_password@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - newsmaker-network
    restart: unless-stopped

  # Parser Service (Python) - gRPC на 50051
  parser-service:
    build:
      context: .
      dockerfile: services/parser/Dockerfile
    container_name: newsmaker-parser
    ports:
      - "50051:50051"
    environment:
      - GRPC_PORT=50051
      - STORAGE_GRPC_URL=storage-service:50055
      - AI_ENGINE_GRPC_URL=ai-engine-service:50052
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_dev_password
    depends_on:
      - storage-service
      - redis
    networks:
      - newsmaker-network
    restart: unless-stopped

  # AI Engine Service (Python) - gRPC на 50052
  ai-engine-service:
    build:
      context: .
      dockerfile: services/ai-engine/Dockerfile
    container_name: newsmaker-ai-engine
    ports:
      - "50052:50052"
    environment:
      - GRPC_PORT=50052
      - STORAGE_GRPC_URL=storage-service:50055
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - YANDEX_API_KEY=${YANDEX_API_KEY:-}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID:-}
    depends_on:
      - storage-service
    networks:
      - newsmaker-network
    restart: unless-stopped

  # Media Service (Python) - gRPC на 50053
  media-service:
    build:
      context: .
      dockerfile: services/media/Dockerfile
    container_name: newsmaker-media
    ports:
      - "50053:50053"
    environment:
      - GRPC_PORT=50053
      - STORAGE_GRPC_URL=storage-service:50055
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=media
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN:-}
      - YANDEX_API_KEY=${YANDEX_API_KEY:-}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID:-}
    depends_on:
      - storage-service
      - minio
    networks:
      - newsmaker-network
    restart: unless-stopped

  # Publishing Service (Node.js) - gRPC на 50054
  publishing-service:
    build:
      context: .
      dockerfile: services/publishing-service/Dockerfile
    container_name: newsmaker-publishing
    ports:
      - "50054:50054"
    environment:
      - GRPC_PORT=50054
      - STORAGE_GRPC_URL=storage-service:50055
      - RABBITMQ_URL=amqp://newsmaker:newsmaker_rabbit_pass@rabbitmq:5672
      - REDIS_URL=redis://:redis_dev_password@redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-}
      - VK_ACCESS_TOKEN=${VK_ACCESS_TOKEN:-}
      - VK_GROUP_ID=${VK_GROUP_ID:-}
    depends_on:
      - storage-service
      - rabbitmq
      - redis
    networks:
      - newsmaker-network
    restart: unless-stopped

  # GraphQL Gateway (Node.js) - HTTP/WS на 4000
  graphql-gateway:
    build:
      context: .
      dockerfile: services/graphql-gateway/Dockerfile
    container_name: newsmaker-graphql
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - STORAGE_GRPC_URL=storage-service:50055
      - PARSER_GRPC_URL=parser-service:50051
      - AI_ENGINE_GRPC_URL=ai-engine-service:50052
      - MEDIA_GRPC_URL=media-service:50053
      - PUBLISHING_GRPC_URL=publishing-service:50054
      - DATABASE_URL=postgresql://newsmaker:newsmaker_dev_password@postgres:5432/newsmaker
      - REDIS_URL=redis://:redis_dev_password@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      storage-service:
        condition: service_started
      parser-service:
        condition: service_started
      ai-engine-service:
        condition: service_started
      media-service:
        condition: service_started
      publishing-service:
        condition: service_started
    networks:
      - newsmaker-network
    restart: unless-stopped

  # ============== FRONTEND ==============

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: newsmaker-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_GRAPHQL_URL=http://localhost:4000/graphql
      - VITE_GRAPHQL_WS_URL=ws://localhost:4000/graphql
    depends_on:
      - graphql-gateway
    networks:
      - newsmaker-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:

networks:
  newsmaker-network:
    driver: bridge
