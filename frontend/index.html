    <meta name="description" content="Платформа для автоматической адаптации и публикации новостного контента с использованием AI" />
    <meta name="theme-color" content="#6366F1" />
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-72x72.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sirius Prism" />
    
    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Windows -->
    <meta name="msapplication-TileColor" content="#6366F1" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    
    <title>Sirius Prism | AI Newsmaker Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              primary: {
                50: '#eff6ff',
                100: '#dbeafe',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
              }
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
        min-height: 100vh;
        overflow-x: hidden;
      }
      
      /* Noise Texture Overlay */
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        opacity: 0.03;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Background Blobs - Vibrant Aurora Style */
      .blob-cont {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: -2;
        overflow: hidden;
        background: #f8fafc;
      }
      
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.7;
        animation: float 20s infinite ease-in-out alternate;
        will-change: transform;
      }

      /* Violet/Purple primary blob */
      .blob-1 {
        top: -10%;
        left: -10%;
        width: 60vw;
        height: 60vw;
        background: radial-gradient(circle, rgba(139,92,246,0.8) 0%, rgba(192,132,252,0.4) 100%);
        animation-duration: 25s;
      }

      /* Cyan/Blue secondary blob */
      .blob-2 {
        bottom: -20%;
        right: -10%;
        width: 70vw;
        height: 70vw;
        background: radial-gradient(circle, rgba(56,189,248,0.7) 0%, rgba(125,211,252,0.3) 100%);
        animation-duration: 35s;
        animation-direction: alternate-reverse;
      }

      /* Pink/Rose accent blob */
      .blob-3 {
        top: 40%;
        left: 30%;
        width: 45vw;
        height: 45vw;
        background: radial-gradient(circle, rgba(244,114,182,0.6) 0%, rgba(251,113,133,0.3) 100%);
        animation-duration: 28s;
      }
      
      /* Yellow/Orange warm accent */
      .blob-4 {
        bottom: 10%;
        left: 10%;
        width: 30vw;
        height: 30vw;
        background: radial-gradient(circle, rgba(250,204,21,0.4) 0%, rgba(253,186,116,0.2) 100%);
        animation-duration: 40s;
        animation-delay: -5s;
      }

      @keyframes float {
        0% { transform: translate(0, 0) rotate(0deg) scale(1); }
        33% { transform: translate(30px, -50px) rotate(10deg) scale(1.1); }
        66% { transform: translate(-20px, 20px) rotate(-5deg) scale(0.9); }
        100% { transform: translate(0, 0) rotate(0deg) scale(1); }
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(99, 102, 241, 0.3); 
        border-radius: 4px;
        backdrop-filter: blur(4px);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(99, 102, 241, 0.6); 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.5.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/",
    "lucide-react": "https://esm.sh/lucide-react@^0.560.0",
    "react": "https://esm.sh/react@^19.2.1",
    "react/": "https://esm.sh/react@^19.2.1/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
<link rel="stylesheet" href="/mobile.css">
</head>
  <body>
    <div class="blob-cont">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="blob blob-4"></div>
    </div>
    <div class="noise-overlay"></div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  
  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((registration) => {
            console.log('✅ SW registered:', registration.scope);
            
            // Проверка обновлений каждые 60 секунд
            setInterval(() => {
              registration.update();
            }, 60000);
          })
          .catch((error) => {
            console.log('❌ SW registration failed:', error);
          });
      });
    }
    
    // Установка PWA prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('💾 PWA install prompt available');
      
      // Можно показать custom кнопку установки
      window.showInstallPromotion = () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              console.log('✅ User accepted PWA install');
            }
            deferredPrompt = null;
          });
        }
      };
    });
    
    // Отслеживание установки PWA
    window.addEventListener('appinstalled', () => {
      console.log('✅ PWA installed');
      deferredPrompt = null;
    });
  </script>
</body>
</html>
