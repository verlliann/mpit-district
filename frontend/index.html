<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="description" content="Платформа для автоматической адаптации и публикации новостного контента с использованием AI" />
    <meta name="theme-color" content="#6366F1" />
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-72x72.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sirius Prism" />
    
    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Windows -->
    <meta name="msapplication-TileColor" content="#6366F1" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    
    <title>Sirius Prism | AI Newsmaker Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
  <body>
    <div class="blob-cont">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="blob blob-4"></div>
    </div>
    <div class="noise-overlay"></div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  
  <!-- PWA Service Worker Registration -->
  <script type="module">
    // Регистрируем SW только в production
    if ('serviceWorker' in navigator && import.meta.env.PROD) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((registration) => {
            console.log('✅ SW registered:', registration.scope);
            
            // Проверка обновлений каждые 60 секунд
            setInterval(() => {
              registration.update();
            }, 60000);
          })
          .catch((error) => {
            console.log('❌ SW registration failed:', error);
          });
      });
    } else if ('serviceWorker' in navigator && !import.meta.env.PROD) {
      // В dev режиме удаляем существующий SW
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        registrations.forEach(registration => {
          registration.unregister();
          console.log('🧹 SW unregistered for development');
        });
      });
    }
    
    // Установка PWA prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('💾 PWA install prompt available');
      
      // Можно показать custom кнопку установки
      window.showInstallPromotion = () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              console.log('✅ User accepted PWA install');
            }
            deferredPrompt = null;
          });
        }
      };
    });
    
    // Отслеживание установки PWA
    window.addEventListener('appinstalled', () => {
      console.log('✅ PWA installed');
      deferredPrompt = null;
    });
  </script>
</body>
</html>
