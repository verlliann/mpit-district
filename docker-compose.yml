version: '3.8'

services:
  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: ai-newsmaker-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - newsmaker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # AI Engine Service (Python) - LLM: GPT-4o, Claude, YandexGPT
  ai-engine-service:
    build:
      context: .
      dockerfile: services/ai-engine/Dockerfile
    container_name: ai-newsmaker-ai-engine
    ports:
      - "50052:50052"
    environment:
      - STORAGE_GRPC_URL=storage-service:50055
      - GRPC_PORT=50052
      # LLM Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
      # Models
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      - YANDEX_MODEL=${YANDEX_MODEL:-yandexgpt-lite}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openai}
    networks:
      - newsmaker-network
    restart: unless-stopped

  # Media Service (Python) - Image: DALL-E, Stable Diffusion, Kandinsky
  media-service:
    build:
      context: .
      dockerfile: services/media/Dockerfile
    container_name: ai-newsmaker-media
    ports:
      - "50053:50053"
    environment:
      - STORAGE_GRPC_URL=storage-service:50055
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - GRPC_PORT=50053
      # Image Generation Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - newsmaker-network
    restart: unless-stopped

networks:
  newsmaker-network:
    driver: bridge

volumes:
  minio_data:
